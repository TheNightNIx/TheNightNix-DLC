<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TheNightNix - متجر DLC والمودات</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0f172a, #1e293b, #0f172a);
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow-x: hidden;
        }

        .container {
            text-align: center;
            max-width: 900px;
            animation: fadeIn 1s ease;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 15px;
            background: linear-gradient(135deg, #38bdf8, #22c55e, #eab308, #38bdf8);
            background-size: 300% 300%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: gradientShift 8s ease infinite;
        }

        p {
            color: #94a3b8;
            font-size: 1.1rem;
            margin-bottom: 50px;
            animation: fadeIn 1.2s ease;
        }

        .nav-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 30px;
            width: 100%;
        }

        .nav-card {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(10px);
            border: 2px solid #334155;
            border-radius: 20px;
            padding: 40px 25px;
            width: 320px;
            text-decoration: none;
            color: inherit;
            transition: all 0.4s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            overflow: hidden;
            animation: slideUp 0.8s ease;
        }

        .nav-card::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.1) 0%, transparent 70%);
            animation: pulse-light 4s ease-in-out infinite;
        }

        .nav-card::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, transparent, rgba(255, 255, 255, 0.05));
            opacity: 0;
            transition: opacity 0.4s ease;
        }

        .card-free::after {
            background: linear-gradient(135deg, rgba(34, 197, 94, 0.15), transparent);
        }

        .card-vip::after {
            background: linear-gradient(135deg, rgba(234, 179, 8, 0.15), transparent);
        }

        .nav-card:hover {
            transform: translateY(-12px);
        }

        .nav-card:hover::after {
            opacity: 1;
        }

        .card-free:hover {
            border-color: #22c55e;
            box-shadow: 0 20px 40px rgba(34, 197, 94, 0.25),
                        0 0 30px rgba(34, 197, 94, 0.15);
        }

        .card-vip:hover {
            border-color: #eab308;
            box-shadow: 0 20px 40px rgba(234, 179, 8, 0.25),
                        0 0 30px rgba(234, 179, 8, 0.15);
        }

        .icon {
            font-size: 60px;
            margin-bottom: 20px;
            display: inline-block;
            animation: float 3s ease-in-out infinite;
            filter: drop-shadow(0 0 15px rgba(255, 255, 255, 0.2));
            position: relative;
            z-index: 1;
        }

        .card-free .icon {
            animation: float 3s ease-in-out infinite, colorShift1 6s ease infinite;
        }

        .card-vip .icon {
            animation: float 3.2s ease-in-out infinite, colorShift2 6s ease infinite 1s;
        }

        .title {
            font-size: 1.5rem;
            font-weight: bold;
            margin-bottom: 12px;
            position: relative;
            z-index: 1;
        }

        .desc {
            font-size: 0.95rem;
            color: #cbd5e1;
            line-height: 1.6;
            margin-bottom: 25px;
            position: relative;
            z-index: 1;
        }

        .badge {
            padding: 10px 20px;
            border-radius: 25px;
            font-weight: bold;
            font-size: 0.9rem;
            position: relative;
            z-index: 1;
            transition: all 0.3s ease;
            display: inline-block;
        }

        .bg-free {
            background: linear-gradient(135deg, #22c55e, #16a34a);
            color: #fff;
            box-shadow: 0 5px 15px rgba(34, 197, 94, 0.3);
        }

        .bg-vip {
            background: linear-gradient(135deg, #eab308, #ca8a04);
            color: #000;
            box-shadow: 0 5px 15px rgba(234, 179, 8, 0.3);
        }

        .badge:hover {
            transform: scale(1.08);
        }

        /* الحركات والتأثيرات */
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(40px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-15px); }
        }

        @keyframes colorShift1 {
            0%, 100% { filter: drop-shadow(0 0 15px rgba(34, 197, 94, 0.8)); }
            50% { filter: drop-shadow(0 0 15px rgba(56, 189, 248, 0.8)); }
        }

        @keyframes colorShift2 {
            0%, 100% { filter: drop-shadow(0 0 15px rgba(234, 179, 8, 0.8)); }
            50% { filter: drop-shadow(0 0 15px rgba(168, 85, 247, 0.8)); }
        }

        @keyframes pulse-light {
            0%, 100% { transform: scale(1); opacity: 0.4; }
            50% { transform: scale(1.15); opacity: 0.7; }
        }

        /* الأجهزة الصغيرة */
        @media (max-width: 768px) {
            h1 {
                font-size: 1.8rem;
            }

            p {
                font-size: 1rem;
            }

            .nav-container {
                flex-direction: column;
                gap: 20px;
            }

            .nav-card {
                width: 100%;
                max-width: 400px;
                padding: 30px 20px;
            }

            .icon {
                font-size: 50px;
            }

            .title {
                font-size: 1.3rem;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>مرحباً بك في TheNightNix</h1>
        <p>اختر القسم الذي تريد تصفحه للبدء في التحميل أو الشراء</p>

        <div class="nav-container">
            <!-- الخيار الأول: قسم المجاني -->
            <a href="free.html" class="nav-card card-free">
                <div class="icon">🎁</div>
                <div class="title" style="color: #22c55e;">المودات المجانية</div>
                <div class="desc">تصفح وحمل الأسلحة والسكينات العادية مجاناً بدون أي مقابل.</div>
                <div class="badge bg-free">دخول القسم المجاني</div>
                <a href="free.html" class="nav-card card-vip">
            </a>

            <!-- الخيار الثاني: قسم المدفوع VIP -->
            <a href="vip.html" class="nav-card card-vip">
                <div class="icon">👑</div>
                <div class="title" style="color: #eab308;">قسم VIP المدفوع</div>
                <div class="desc">حزم وأسلحة حصرية ونادرة جداً (الدفع عبر Razer Gold أو Steam).</div>
                <div class="badge bg-vip">دخول قسم VIP</div>
                <a href="vip.html" class="nav-card card-free">
            </a>
        </div>
    </div>

</body>
</html>
