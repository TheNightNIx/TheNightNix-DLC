<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>متجر المودات والـ DLCs</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0f172a; color: #f8fafc; text-align: center; min-height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 20px; }
        h1 { color: #38bdf8; font-size: 2.2rem; margin-bottom: 10px; }
        p { color: #94a3b8; font-size: 1.1rem; margin-bottom: 40px; }
        .nav-container { display: flex; flex-wrap: wrap; justify-content: center; gap: 25px; max-width: 800px; width: 100%; }
        .nav-card { background: #1e293b; border: 2px solid #334155; border-radius: 16px; padding: 30px 20px; width: 320px; text-decoration: none; color: inherit; transition: all 0.3s ease; display: flex; flex-direction: column; align-items: center; }
        .nav-card:hover { transform: translateY(-8px); }
        .card-free:hover { border-color: #22c55e; box-shadow: 0 10px 25px rgba(34, 197, 94, 0.2); }
        .card-vip:hover { border-color: #eab308; box-shadow: 0 10px 25px rgba(234, 179, 8, 0.2); }
        .icon { font-size: 50px; margin-bottom: 15px; }
        .title { font-size: 1.5rem; font-weight: bold; margin-bottom: 10px; }
        .desc { font-size: 0.95rem; color: #94a3b8; line-height: 1.5; }
        .badge { margin-top: 20px; padding: 8px 16px; border-radius: 20px; font-weight: bold; font-size: 0.9rem; }
        .bg-free { background-color: #22c55e; color: #000; }
        .bg-vip { background-color: #eab308; color: #000; }
    </style>
</head>
<body>

    <h1>مرحباً بك في متجر الـ DLCs</h1>
    <p>اختر القسم الذي تريد تصفحه للبدء في التحميل أو الشراء</p>

    <div class="nav-container">
        <!-- الخيار الأول: قسم المجاني -->
        <a href="free.html" class="nav-card card-free">
            <div class="icon">🎁</div>
            <div class="title" style="color: #22c55e;">المودات المجانية</div>
            <div class="desc">تصفح وحمل الأسلحة والسكينات العادية مجاناً بدون أي مقابل.</div>
            <div class="badge bg-free">دخول القسم المجاني</div>
        </a>

        <!-- الخيار الثاني: قسم المدفوع VIP -->
        <a href="vip.html" class="nav-card card-vip">
            <div class="icon">👑</div>
            <div class="title" style="color: #eab308;">قسم VIP المدفوع</div>
            <div class="desc">حزم وأسلحة حصرية ونادرة جداً (الدفع عبر Razer Gold أو Steam).</div>
            <div class="badge bg-vip">دخول قسم VIP</div>
        </a>
    </div>

</body>
</html>
